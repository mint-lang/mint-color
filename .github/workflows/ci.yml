name: CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install tools from asdf config
        uses: ai/asdf-cache-action@v1

      - name: Run script
        run: mint test
