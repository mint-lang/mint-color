name: CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools from asdf config
        uses: asdf-vm/actions/install@v4

      - name: Run script
        run: mint test -b firefox
